# Opens a "chore: release vX.Y.Z" PR carrying the version bump and changelog.
#
# Run it manually (Actions → Release Prepare). `increment: auto` lets
# @release-it/conventional-changelog derive the bump from conventional commits
# since the last tag. Merging the PR triggers release-publish.yml, which tags
# the merge commit and creates the GitHub release.

name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment (auto derives it from conventional commits)
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

# One release prep at a time; never cancel — a killed run leaves a stray commit.
concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    # cmd/api's integration test (auth, roles, CSRF) skips itself without a
    # database, so the gate provides one.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gofi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gofi_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history — the conventional-changelog plugin diffs against the
          # previous tag to compute the bump and the release notes.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The release gate: no release PR is opened unless all three pass.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        env:
          TEST_DB_DSN: postgres://postgres:postgres@localhost:5432/gofi_test?sslmode=disable

      # Pinned: this job holds a token that can write to the repository.
      - name: Scan dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # package.json has no dependencies: its scripts fetch release-it with npx,
      # at the versions pinned there.
      - name: Bump version and changelog
        id: bump
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          if [ "$INCREMENT" = "auto" ]; then
            npm run release:prepare
          else
            npm run release:prepare -- --increment "$INCREMENT"
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        # Third-party action with write access, pinned to a commit: a tag can be moved.
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: release/v${{ steps.bump.outputs.version }}
          title: "chore: release v${{ steps.bump.outputs.version }}"
          labels: release
          delete-branch: true
          body: |
            Release **v${{ steps.bump.outputs.version }}** — version bump and changelog generated by release-it.

            Merging this PR tags `v${{ steps.bump.outputs.version }}`, creates the GitHub release, and dispatches the Docker image build.
